{% extends "base.html" %}

{% block title %}PRA3 Chatbot{% endblock %}

{% block page_content %}

<div class="page-header">
    <h1>Chatbot</h1>
</div>

<div id="messages"></div>

<div class="form-group">
    <input
        type="text"
        id="message-input"
        class="form-control"
        placeholder="Enter a message">
</div>

<button id="send-button" class="btn btn-primary">
    Send
</button>

<a href="{{ url_for('logout') }}" class="btn btn-default">
    Logout
</a>

{% endblock %}


{% block scripts %}
{{ super() }}

<script>

function addMessage(sender, text) {
    const messages = document.getElementById("messages");

    const paragraph = document.createElement("p");

    const senderText = document.createElement("strong");
    senderText.textContent = sender + ": ";

    paragraph.appendChild(senderText);
    paragraph.appendChild(document.createTextNode(text));

    messages.appendChild(paragraph);
}


async function sendMessage() {

    const input = document.getElementById("message-input");
    const message = input.value.trim();

    if (message === "") {
        return;
    }

    addMessage("You", message);

    const response = await fetch("{{ url_for('chat') }}", {
        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            message: message
        })
    });

    const data = await response.json();

    addMessage("Bot", data.reply);

    input.value = "";
}


document
    .getElementById("send-button")
    .addEventListener("click", sendMessage);

</script>

{% endblock %}
